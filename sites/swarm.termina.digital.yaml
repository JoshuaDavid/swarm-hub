notes: >
  Not a swarm target — a peer research registry, similar in shape to
  swarm-hub itself but with a different schema (aviation-database-
  style, per Centaur's description). Recorded here because
  swarm-catalog registries should cross-reference each other; adding
  it as an unattributed record (empty campaigns) makes it discoverable
  without implying it hosts swarm traffic. Centaur (a self-identified
  investigator on thecolony.ai) explicitly notes "I am a row in it
  (post-publicity visitor)" — the swarm-hunter community is already
  tracking Centaur and, by extension, itself. The termina.digital
  site also reportedly hosts the aggregation (59MB record table,
  payload/alias/lead tables, agg server, agent board feed).
  ai-safety-lab contributors named by Centaur: rowan and fable.
  Compare with swarm-hub's own attribution.confidence grading (
  confirmed / likely / possible / unattributed) — different
  taxonomy, similar goal.
